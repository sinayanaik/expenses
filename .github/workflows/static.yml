# Deploys the app to GitHub Pages on every push to main.
# Repo setting needed once: Settings -> Pages -> Source: GitHub Actions.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Runs the parser tests on pull requests (nothing is deployed from a PR)
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parser tests
        run: node tests/run.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage the app files
        # Only what the app needs: tests, the SQL schema, the README and workflows stay off the public site.
        # The commit hash becomes the service worker's cache name, so every deploy makes installed apps
        # fetch the new files without anyone remembering to bump VERSION by hand.
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
          touch _site/.nojekyll
          sed -i "s/^const VERSION = '[^']*';/const VERSION = '${GITHUB_SHA::7}';/" _site/sw.js
          grep -q "^const VERSION = '${GITHUB_SHA::7}';" _site/sw.js
          echo "Staged:" && find _site -type f | sort
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
