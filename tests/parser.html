<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parser tests</title>
  <style>
    body { font: 14px/1.45 system-ui, sans-serif; margin: 16px; max-width: 900px; }
    h1 { font-size: 20px; }
    .case { border: 1px solid #ccc; border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
    .pass { border-left: 6px solid #2da44e; }
    .fail { border-left: 6px solid #cf222e; background: #fff5f5; }
    .sms { color: #555; font-size: 13px; white-space: pre-wrap; }
    .diff { color: #cf222e; font-family: ui-monospace, monospace; font-size: 12px; }
    details pre { font-size: 12px; overflow-x: auto; }
    #summary { font-weight: 600; }
  </style>
</head>
<body>
  <h1>SMS parser tests</h1>
  <p id="summary">Running…</p>
  <div id="out"></div>
  <script type="module">
    import { runAll } from './check.js';
    const results = runAll();
    const out = document.getElementById('out');
    for (const r of results) {
      const div = document.createElement('div');
      div.className = `case ${r.pass ? 'pass' : 'fail'}`;
      const head = document.createElement('strong');
      head.textContent = `${r.pass ? '✓' : '✗'} ${r.name}`;
      const sms = document.createElement('div');
      sms.className = 'sms';
      sms.textContent = r.sms;
      div.append(head, sms);
      for (const d of r.diffs) {
        const p = document.createElement('div');
        p.className = 'diff';
        p.textContent = `${d.field}: expected ${JSON.stringify(d.expected)}, got ${JSON.stringify(d.got)}`;
        div.append(p);
      }
      const det = document.createElement('details');
      det.innerHTML = '<summary>Parsed fields</summary><pre></pre>';
      const { raw, ...fields } = r.got;
      det.querySelector('pre').textContent = JSON.stringify(fields, null, 2);
      div.append(det);
      out.append(div);
    }
    const failed = results.filter(r => !r.pass).length;
    document.getElementById('summary').textContent =
      `${results.length - failed} of ${results.length} passed` + (failed ? ` — ${failed} failing` : '');
    document.title = failed ? `✗ ${failed} failing` : '✓ Parser tests';
  </script>
</body>
</html>
