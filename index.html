<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Expenses</title>
  <meta name="description" content="Paste a bank SMS, check the fields, save. Offline-first expense tracker.">
  <meta name="theme-color" content="#1f6feb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top">
    <h1>Expenses</h1>
    <button id="sync-pill" class="pill idle" type="button">…</button>
  </header>

  <main>
    <div id="view-add" class="view"></div>
    <div id="view-list" class="view" hidden></div>
    <div id="view-stats" class="view" hidden></div>
    <div id="view-settings" class="view" hidden></div>
  </main>

  <nav class="tabs" aria-label="Screens">
    <button type="button" data-view="add" aria-current><span aria-hidden="true">＋</span>Add</button>
    <button type="button" data-view="list"><span aria-hidden="true">☰</span>List</button>
    <button type="button" data-view="stats"><span aria-hidden="true">▥</span>Stats</button>
    <button type="button" data-view="settings"><span aria-hidden="true">⚙</span>Settings</button>
  </nav>

  <noscript>This app needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
